<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>HubLand Game</title>
<style>
  :root{
    --bg-deep:#08091a; --panel:#11132b; --panel-edge:#282d55;
    --neon-cyan:#08d9d6; --gold:#ffd166; --dust:#d9c5ff; --hp:#ff4d6d;
    --ink:#eef1ff; --ink-dim:rgba(238,241,255,0.55);
  }
  html,body{
    margin:0; padding:0; width:100%; height:100%; background:var(--bg-deep);
    overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none;
    font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif; letter-spacing:.12px; color:var(--ink);
  }
  #gameCanvas{ display:block; width:100vw; height:100vh; }
  @keyframes gameplayMapDrop{
    0%{opacity:0;transform:translate3d(0,-54px,0) scale(.985)}
    62%{opacity:1;transform:translate3d(0,6px,0) scale(1.004)}
    80%{transform:translate3d(0,-2px,0) scale(.999)}
    100%{opacity:1;transform:translate3d(0,0,0) scale(1)}
  }
  #gameCanvas.gameplay-map-enter{animation:gameplayMapDrop .82s cubic-bezier(.2,1.2,.32,1) both;will-change:transform,opacity}
  @media(prefers-reduced-motion:reduce){#gameCanvas.gameplay-map-enter{animation:none!important}}

  #topBar{
    backdrop-filter:blur(13px);
    position:fixed; top:0; left:0; width:100%; box-sizing:border-box; height:56px;
    display:flex; align-items:center; justify-content:space-between; padding:0 8px; gap:4px;
    background:linear-gradient(to bottom, rgba(8,9,26,0.94), rgba(8,9,26,0.5));
    border-bottom:1px solid var(--panel-edge); z-index:8; overflow:hidden;
  }
  .stat{display:flex; align-items:center; gap:4px; font-weight:800; font-size:12.5px; white-space:nowrap;}
  #goldStat{color:var(--gold); text-shadow:0 0 10px rgba(255,209,102,0.5);padding:5px 9px;border-radius:11px;background:rgba(255,209,102,.07);border:1px solid rgba(255,209,102,.15);transition:transform .12s;}
  #lifeStat{color:var(--hp); text-shadow:0 0 10px rgba(255,77,109,0.5);padding:5px 8px;border-radius:11px;background:rgba(255,77,109,.07);border:1px solid rgba(255,77,109,.14);}
  #waveStat{color:var(--ink); opacity:0.9; font-size:10.5px; text-align:center;}
  #waveStat b{color:var(--neon-cyan);}
  #nextWaveBtn{
    background:linear-gradient(135deg, var(--neon-cyan), #05a8a6); border:none; color:#03282a;
    font-weight:800; font-size:10.5px; padding:7px 9px; border-radius:15px; white-space:nowrap;
    box-shadow:0 4px 14px rgba(8,217,214,0.35);
  }
  #nextWaveBtn:disabled{ background:#2a2e4d; color:rgba(238,241,255,0.35); box-shadow:none; }
  #speedBtn{ background:var(--panel); border:1.5px solid var(--panel-edge); color:var(--ink); font-weight:800; font-size:10.5px; padding:7px 8px; border-radius:13px; }
  #speedBtn.active{ border-color:var(--gold); color:var(--gold); }
  #autoWaveBtn{ background:var(--panel); border:1.5px solid var(--panel-edge); color:var(--ink); font-weight:800; font-size:9.5px; padding:7px 7px; border-radius:13px; }
  #autoWaveBtn.active{ border-color:#5eead4; color:#5eead4; box-shadow:0 0 10px rgba(94,234,212,0.4); }

  #bottomBar{display:none!important;
    position:fixed; bottom:0; left:0; width:100%; box-sizing:border-box;
    display:flex; gap:5px; justify-content:flex-start; align-items:stretch;
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, rgba(8,9,26,0.96), rgba(8,9,26,0.65));
    border-top:1px solid var(--panel-edge); z-index:8; overflow-x:auto;
  }
  .towerCard{
    flex:0 0 58px; background:var(--panel); border:1.5px solid var(--panel-edge); border-radius:10px;
    padding:4px 3px 4px; display:flex; flex-direction:column; align-items:center; gap:1px; position:relative;
  }
  .towerCard.selected{ box-shadow:0 0 0 2px rgba(8,217,214,0.35), 0 0 14px rgba(8,217,214,0.35); }
  .towerCard .swatch{ width:21px; height:21px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:11.5px; }
  .towerCard .tname{ font-size:7.4px; font-weight:700; text-align:center; line-height:1.03; }
  .towerCard .tkind{ font-size:6.2px; opacity:0.55; text-transform:uppercase; letter-spacing:0.2px; }
  .towerCard .tcost{ font-size:8.6px; color:var(--gold); font-weight:800; }
  .towerCard.locked{ opacity:0.35; }
  .towerCard.locked .tcost{ color:var(--ink-dim); }
  .towerCard .dustTag{ position:absolute; top:2px; right:2px; font-size:7px; color:var(--dust); }



  .collectionTabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
  .collectionTabs button{border:1px solid var(--panel-edge);border-radius:10px;padding:8px 11px;background:#151c39;color:var(--ink);font-weight:800;font-size:11px}
  .collectionTabs button.active{background:linear-gradient(135deg,#146a76,#34336d);border-color:#6de6df}
  .collectionGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px;width:min(900px,94vw);max-height:55vh;overflow:auto;padding:4px}
  .collectionCard{padding:11px;border:1px solid var(--panel-edge);border-radius:13px;background:linear-gradient(145deg,rgba(38,48,78,.9),rgba(15,20,43,.96));text-align:left}
  .collectionCard h4{margin:0 0 6px;font-size:12px;color:#f5f7ff}
  .collectionCard p{font-size:10px;line-height:1.45;opacity:.78;margin:4px 0}
  .collectionCard .owned{color:#79e7b1;font-weight:900;font-size:9px}
  .collectionCard .locked{color:#ffbd76;font-weight:900;font-size:9px}

  #topBar #inventoryToggle{
    -webkit-appearance:none;appearance:none;flex:0 0 30px;position:relative;left:auto;bottom:auto;z-index:10;
    box-sizing:border-box;width:30px!important;min-width:30px;height:30px!important;min-height:30px;padding:0!important;
    border:1px solid rgba(117,231,225,.55)!important;border-radius:9px!important;
    color:#eaffff!important;font:700 16px/1 sans-serif!important;
    background:linear-gradient(135deg,rgba(13,44,59,.97),rgba(18,24,52,.97))!important; -webkit-tap-highlight-color:transparent;
    box-shadow:0 3px 10px rgba(0,0,0,.3)!important;display:none;align-items:center;justify-content:center;
    outline:none;text-shadow:0 1px 3px #000;
  }
  #topBar #inventoryToggle:focus,#topBar #inventoryToggle:active{
    background:linear-gradient(135deg,#17485a,#182444)!important;color:#eaffff!important;
  }
  #inventoryPanel{
    position:fixed;left:8px;top:62px;bottom:auto;width:min(184px,calc(100vw - 16px));max-height:min(42vh,300px);
    overflow:auto;z-index:13;display:none;padding:6px;resize:both;border:1px solid rgba(117,231,225,.45);
    border-radius:18px;background:linear-gradient(155deg,rgba(14,25,48,.98),rgba(8,12,29,.98));
    box-shadow:0 18px 50px rgba(0,0,0,.58),0 0 24px rgba(8,217,214,.12);backdrop-filter:blur(14px);
  }
  #inventoryPanel.open{display:block;animation:inventoryPop .28s cubic-bezier(.2,1.3,.35,1) both}
  @keyframes inventoryPop{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
  .inventoryHead{display:flex;align-items:center;justify-content:space-between;margin:-6px -6px 6px;padding:6px;background:rgba(69,100,143,.18);border-radius:10px;cursor:move;touch-action:none}
  .inventoryHead strong{font-size:9px;letter-spacing:.45px;color:#e8ffff}
  .inventoryHead button{background:#242b49;color:#dce8ff;border:1px solid #465071;border-radius:8px;padding:3px 6px;font-size:9px}
  #inventoryGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
  .invCard{min-height:42px;display:grid;grid-template-columns:22px 1fr;align-items:center;gap:4px;text-align:left;
    padding:4px;border-radius:13px;border:1px solid rgba(139,164,205,.25);
    background:linear-gradient(145deg,rgba(36,48,79,.92),rgba(17,23,46,.96));color:#f1f5ff;
    touch-action:none;cursor:grab;transition:transform .16s,border-color .16s,box-shadow .16s}
  .invCard:active{cursor:grabbing;transform:scale(.97)}
  .invIcon{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;background:rgba(255,255,255,.07)}
  .invName{font-size:8px;font-weight:800;line-height:1.05}
  .invKind{font-size:6px;opacity:.58;margin-top:1px}
  .invCost{font-size:8px;font-weight:900;color:#ffda75;margin-top:2px}
  .invCard.cannot-afford{border-color:rgba(255,77,109,.5)}
  #dragGhost{position:fixed;z-index:30;display:none;pointer-events:none;padding:9px 13px;border-radius:12px;
    color:#fff;background:rgba(14,27,49,.94);border:1px solid #5de4dc;box-shadow:0 8px 28px #0008;font-weight:800;font-size:12px}
  #dragActionBar{position:fixed;z-index:31;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);
    display:none;align-items:center;gap:10px;padding:8px 10px;border:1px solid rgba(117,231,225,.42);
    border-radius:16px;background:rgba(9,17,37,.96);box-shadow:0 8px 28px #0009;backdrop-filter:blur(12px);white-space:nowrap}
  #dragActionBar.active{display:flex}
  #dragActionBar span{font-size:10px;color:#dce8ff;opacity:.82}
  #dragActionBar button{border:1px solid #465071;border-radius:10px;padding:8px 11px;background:#202b49;color:#f1f5ff;font-size:11px;font-weight:900}
  #dragReturnBtn{border-color:rgba(8,217,214,.55)!important;color:#8ff5ec!important}
  #dragCancelBtn{background:#38253b!important;border-color:#80506b!important;color:#ffd8e7!important}
  .invCard.drag-source{opacity:.45;border-color:#5de4dc;box-shadow:0 0 0 2px rgba(8,217,214,.18)}
  @media(max-width:700px){#dragActionBar{bottom:calc(12px + env(safe-area-inset-bottom));gap:6px;padding:7px}#dragActionBar span{font-size:9px}#dragActionBar button{padding:8px 9px;font-size:10px}}
  #goldStat.insufficient{animation:goldBuzzer .48s ease-in-out 2}
  @keyframes goldBuzzer{0%,100%{transform:translateX(0);color:#ff4d6d;text-shadow:0 0 14px #ff4d6d}
    20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
  #inventoryHint{font-size:7px;opacity:.64;margin:0 0 4px;text-align:left}
  @media(max-width:700px){#inventoryToggle{width:27px;height:27px;font-size:15px}
    #inventoryPanel{top:58px;left:5px;width:min(176px,calc(100vw - 10px));max-height:38vh}}

  #towerPanel{
    background:linear-gradient(155deg,rgba(24,34,64,.98),rgba(10,15,35,.98));
    border-color:rgba(102,224,220,.42);
    backdrop-filter:blur(14px);
    position:fixed; z-index:9; background:var(--panel); border:1.5px solid var(--panel-edge); border-radius:14px;
    padding:10px 12px; font-size:11.5px; box-shadow:0 10px 28px rgba(0,0,0,0.5); display:none; min-width:164px;
  }
  #towerPanel .tpTitle{ font-weight:900; font-size:13px; margin-bottom:7px; color:#f4fbff; letter-spacing:.25px; }
  #towerPanel .tpRow{ display:flex; justify-content:space-between; gap:12px; opacity:.82; margin:4px 0; font-size:10.5px; }
  #towerPanel .tpBtns{ display:flex; gap:6px; margin-top:8px; }
  #towerPanel button{ flex:1; border:none; border-radius:9px; padding:7px 4px; font-weight:800; font-size:11px; }
  #upgradeBtn{ background:linear-gradient(135deg, var(--neon-cyan), #05a8a6); color:#03282a; }
  #upgradeBtn:disabled{ background:#2a2e4d; color:rgba(238,241,255,0.35); }
  #sellBtn{ background:linear-gradient(135deg, #ff6b6b, #b0195f); color:#fff; }
  #closeTpBtn{ background:transparent; color:var(--ink-dim); flex:0 0 24px; }

  #overlay{
    position:fixed; inset:0; z-index:15; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    text-align:center; padding:22px 18px 40px; box-sizing:border-box;
    background:radial-gradient(ellipse at center, rgba(20,24,51,0.68) 0%, rgba(8,9,26,0.95) 78%);
    overflow-y:auto;
  }
  #overlay h1{
    font-size:clamp(20px,5.6vw,32px); margin:6px 0 10px 0; letter-spacing:0.4px;
    background:linear-gradient(90deg, var(--neon-cyan), var(--gold));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #overlay h3{ font-size:12px; margin:14px 0 6px; opacity:0.6; letter-spacing:0.5px; text-transform:uppercase; }
  #infiniteCornerBtn{
    position:absolute; top:14px; right:14px; z-index:16;
    background:var(--panel); border:1.5px solid var(--panel-edge); color:var(--ink);
    font-weight:800; font-size:11px; padding:8px 12px; border-radius:13px; cursor:pointer;
    display:flex; align-items:center; gap:5px; opacity:0.85;
  }
  #infiniteCornerBtn.active{ border-color:#5eead4; color:#5eead4; box-shadow:0 0 10px rgba(94,234,212,0.4); opacity:1; }
  .cornerCloseBtn{
    position:absolute; top:14px; left:14px; z-index:16;
    width:34px; height:34px; border-radius:50%;
    background:var(--panel); border:1.5px solid var(--panel-edge); color:var(--ink);
    font-size:16px; font-weight:800; display:flex; align-items:center; justify-content:center;
    cursor:pointer; opacity:0.85;
  }
  #exitBtn{
    background:var(--panel); border:1.5px solid var(--panel-edge); color:var(--ink);
    font-weight:800; font-size:12px; padding:6px 9px; border-radius:12px; cursor:pointer;
  }
  #overlay p{ margin:4px 0 16px; font-size:13px; opacity:0.75; max-width:400px; line-height:1.55; }
  #overlay .big{ font-size:clamp(28px,7.5vw,42px); font-weight:800; margin-bottom:2px; color:var(--gold); text-shadow:0 0 18px rgba(255,209,102,0.45); }
  #overlay .sub{ font-size:11px; opacity:0.6; margin-bottom:16px; }
  .btn{
    letter-spacing:.45px;transition:transform .16s,filter .16s,box-shadow .16s;
    background:linear-gradient(135deg, var(--neon-cyan), #05a8a6); color:#03282a; border:none;
    padding:11px 24px; border-radius:22px; font-size:13px; font-weight:800;
    box-shadow:0 8px 22px rgba(8,217,214,0.3); margin:4px;
  }
  .btn.secondary{ background:var(--panel); color:var(--ink); border:1.5px solid var(--panel-edge); box-shadow:none; }
  .btn.dust{ background:linear-gradient(135deg, var(--dust), #8b6fd6); }
  .btn:active{ transform:scale(.96);filter:brightness(1.12);box-shadow:0 3px 10px rgba(8,217,214,.2); }
  .btn:disabled{ opacity:0.35; }
  .rowBtns{ display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; justify-content:center; max-width:480px; }
  .pickBtn{ background:var(--panel); border:1.5px solid var(--panel-edge); color:var(--ink); padding:7px 11px; border-radius:14px; font-size:11px; font-weight:700; }
  .pickBtn.active{ border-color:var(--gold); color:var(--gold); }
  .menuRow{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:4px; align-items:center; }
  .marketWrap{ display:flex; flex-direction:column; align-items:center; margin:4px; }
  .marketLabel{ font-size:9.5px; opacity:0.6; letter-spacing:1px; margin-bottom:3px; text-transform:uppercase; }

  .metaGrid{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:560px; margin-bottom:8px; }
  .metaCard{ background:var(--panel); border:1.5px solid var(--panel-edge); border-radius:13px; padding:10px 11px; width:130px; text-align:left; }
  .metaCard .mTitle{ font-weight:800; font-size:11px; margin-bottom:3px; }
  .metaCard .mDesc{ font-size:9.5px; opacity:0.65; line-height:1.32; margin-bottom:7px; min-height:34px; }
  .metaCard .mLevel{ font-size:9.5px; color:var(--neon-cyan); margin-bottom:6px; }
  .metaCard button{ width:100%; border:none; border-radius:9px; padding:6px 4px; font-weight:800; font-size:10px; background:linear-gradient(135deg, var(--dust), #8b6fd6); color:#1a0f33; }
  .metaCard button:disabled{ background:#2a2e4d; color:rgba(238,241,255,0.35); }

  .runeGrid{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; max-width:560px; margin-bottom:6px; }
  .runeCard{ background:var(--panel); border:1.5px solid var(--panel-edge); border-radius:16px; padding:14px 12px; width:140px; cursor:pointer; }
  .runeCard:active{ transform:scale(0.97); }
  .runeCard .rIcon{ font-size:22px; margin-bottom:6px; }
  .runeCard .rName{ font-weight:800; font-size:11.5px; margin-bottom:5px; }
  .runeCard .rDesc{ font-size:9.5px; opacity:0.65; line-height:1.35; }

  .statLine{ font-size:11px; opacity:0.7; margin:2px 0; }
  .playerColorSetting{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:22px;padding:12px 14px;background:rgba(17,19,43,.8);border:1px solid var(--panel-edge);border-radius:14px;width:min(360px,90%);box-sizing:border-box}
  .playerColorSetting label{font-size:12px;font-weight:800}
  .playerColorSetting input{width:42px;height:32px;padding:2px;border:1px solid var(--panel-edge);border-radius:8px;background:var(--panel)}
  .playerColorSetting span{font-size:10px;opacity:.65;width:100%}
  .joystickSetting{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:8px;padding:11px 14px;
    background:rgba(17,19,43,.8);border:1px solid var(--panel-edge);border-radius:14px;width:min(360px,90%);box-sizing:border-box}
  .joystickSetting label{font-size:12px;font-weight:800}
  .joystickSetting select{padding:8px 10px;border-radius:9px;border:1px solid var(--panel-edge);background:#090b20;color:var(--ink);font-weight:700}
  .joystickSetting span{font-size:10px;opacity:.65;width:100%}
  .roomPanel{width:min(520px,96%);box-sizing:border-box;background:rgba(17,19,43,.96);border:1px solid var(--panel-edge);border-radius:16px;padding:14px;margin:8px auto;text-align:left}
  .roomPanel h2{font-size:19px;margin:4px 0 10px;color:var(--neon-cyan)}
  .roomGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .roomField{display:flex;flex-direction:column;gap:4px;font-size:11px;opacity:.95}
  .roomField input,.roomField select{min-width:0;width:100%;box-sizing:border-box;padding:9px;border-radius:9px;border:1px solid var(--panel-edge);background:#090b20;color:var(--ink)}
  .roomList{display:flex;flex-direction:column;gap:7px;margin-top:8px}.roomItem{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px;border:1px solid var(--panel-edge);border-radius:10px;font-size:12px}.roomItem small{display:block;opacity:.65;margin-top:3px}.roomStatus{font-size:11px;opacity:.75;margin:8px 0}
  #joystickZone{position:fixed;left:0;bottom:0;width:min(38vw,170px);height:min(34vh,170px);z-index:10;display:none;pointer-events:none;border:1px dashed rgba(150,205,255,.18);border-radius:0 14px 0 0;background:linear-gradient(135deg,rgba(85,140,210,.045),rgba(85,140,210,.01));box-sizing:border-box}
  #joystickZone.active{display:block}
  #joystickBase{position:fixed;z-index:12;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;border:2px solid rgba(210,230,255,.55);background:rgba(80,130,190,.18);pointer-events:none;display:none;box-sizing:border-box;backdrop-filter:blur(2px);transition:opacity .12s}
  #joystickKnob{position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;background:rgba(100,180,255,.8);border:2px solid rgba(225,242,255,.9);box-shadow:0 0 16px rgba(70,160,255,.45);box-sizing:border-box}
  #eggToast{
    position:fixed; top:38%; left:50%; transform:translate(-50%,-50%);
    background:rgba(20,24,51,0.95); border:1.5px solid var(--gold); border-radius:16px;
    padding:14px 22px; font-size:13px; color:var(--gold); z-index:30; text-align:center;
    opacity:0; transition:opacity 0.4s; pointer-events:none;
  }


  /* ===== TÜM EKRANLAR: üstten geliş + yaylanma + fade ===== */
  @keyframes universalScreenDrop{
    0%{opacity:0;transform:translate3d(0,-42px,0) scale(.975)}
    62%{opacity:1;transform:translate3d(0,5px,0) scale(1.006)}
    78%{transform:translate3d(0,-2px,0) scale(.999)}
    100%{opacity:1;transform:translate3d(0,0,0) scale(1)}
  }
  #overlay.screen-enter > .screen-enter-item{
    animation:universalScreenDrop .68s cubic-bezier(.2,1.25,.35,1) both;
    will-change:transform,opacity;
  }
  #overlay.screen-enter > .screen-enter-item:nth-child(2){animation-delay:.045s}
  #overlay.screen-enter > .screen-enter-item:nth-child(3){animation-delay:.09s}
  #overlay.screen-enter > .screen-enter-item:nth-child(4){animation-delay:.135s}
  #overlay.screen-enter > .screen-enter-item:nth-child(5){animation-delay:.18s}
  #overlay.screen-enter .screen-enter-card{
    animation:universalScreenDrop .62s cubic-bezier(.2,1.25,.35,1) both;
    will-change:transform,opacity;
  }
  #overlay.screen-enter .screen-enter-card:nth-of-type(2){animation-delay:.035s}
  #overlay.screen-enter .screen-enter-card:nth-of-type(3){animation-delay:.07s}
  #overlay.screen-enter .screen-enter-card:nth-of-type(4){animation-delay:.105s}

/* ===== HubLand hesaba özel kayıt katmanı ===== */
(function(){
  const GAME_PREFIXES=['avd_'];
  const UID_SESSION_KEY='hubland_active_uid';
  const MIGRATION_OWNER_KEY='hubland_legacy_owner_ayvadisi';
  const rawGet=Storage.prototype.getItem;
  const rawSet=Storage.prototype.setItem;
  const rawRemove=Storage.prototype.removeItem;
  const rawKey=Storage.prototype.key;
  function activeUid(){ return sessionStorage.getItem(UID_SESSION_KEY)||''; }
  function isGameKey(key){ return GAME_PREFIXES.some(p=>String(key).startsWith(p)); }
  function scopedKey(key){
    const uid=activeUid();
    return uid&&isGameKey(key)?'__hubland_'+uid+'__'+key:String(key);
  }
  Storage.prototype.getItem=function(key){
    if(this===localStorage) return rawGet.call(this,scopedKey(key));
    return rawGet.call(this,key);
  };
  Storage.prototype.setItem=function(key,value){
    if(this===localStorage) return rawSet.call(this,scopedKey(key),value);
    return rawSet.call(this,key,value);
  };
  Storage.prototype.removeItem=function(key){
    if(this===localStorage) return rawRemove.call(this,scopedKey(key));
    return rawRemove.call(this,key);
  };
  function migrateLegacyTo(uid){
    if(!uid)return;
    const owner=rawGet.call(localStorage,MIGRATION_OWNER_KEY);
    if(owner)return;
    const keys=[];
    for(let i=0;i<localStorage.length;i++){
      const k=rawKey.call(localStorage,i);
      if(k&&isGameKey(k)&&!k.startsWith('__hubland_'))keys.push(k);
    }
    for(const k of keys){
      const value=rawGet.call(localStorage,k);
      const target='__hubland_'+uid+'__'+k;
      if(value!==null&&rawGet.call(localStorage,target)===null) rawSet.call(localStorage,target,value);
    }
    rawSet.call(localStorage,MIGRATION_OWNER_KEY,uid);
  }
  window.addEventListener('message',function(e){
    const d=e.data||{};
    if(d.type!=='HUBLAND_AUTH_CONTEXT')return;
    const next=String(d.uid||'');
    const current=activeUid();
    if(next&&next!==current){
      migrateLegacyTo(next);
      sessionStorage.setItem(UID_SESSION_KEY,next);
      location.reload();
    }
  });
  try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'HUBLAND_REQUEST_AUTH_CONTEXT'},'*')}catch(_){}
})();

  const ROUTE_INSET = 0.12;
  function computePath(){
    const available={x:0,y:TOP_H,w:Math.max(1,W),h:Math.max(1,H-TOP_H)};
    // Fit the original landscape route, then extend the surrounding world so
    // portrait screens show terrain instead of empty black letterboxing.
    const baseFit=Math.min(1,(available.w-16)/MAP_WORLD_WIDTH,(available.h-16)/MAP_WORLD_HEIGHT);
    const z=Math.max(.05,baseFit);
    const worldW=Math.max(MAP_WORLD_WIDTH,available.w/z);
    const worldH=Math.max(MAP_WORLD_HEIGHT,available.h/z);
    playArea={x:0,y:available.y,w:worldW,h:worldH};
    routeArea={
      x:playArea.x+(playArea.w-MAP_WORLD_WIDTH)/2,
      y:playArea.y+(playArea.h-MAP_WORLD_HEIGHT)/2,
      w:MAP_WORLD_WIDTH,h:MAP_WORLD_HEIGHT
    };
    const sourcePoints=currentPathRel;
    pathPts = sourcePoints.map(p=>({x:routeArea.x+(ROUTE_INSET+p.x*(1-2*ROUTE_INSET))*routeArea.w, y:routeArea.y+(ROUTE_INSET+p.y*(1-2*ROUTE_INSET))*routeArea.h}));

    }

  function distToSeg(px,py,a,b){
    const dx=b.x-a.x, dy=b.y-a.y, len2=dx*dx+dy*dy;
    let t = len2>0 ? ((px-a.x)*dx+(py-a.y)*dy)/len2 : 0;
    t = Math.max(0,Math.min(1,t));
    return Math.hypot(px-(a.x+dx*t), py-(a.y+dy*t));
  }
  function distToPath(x,y){
    let best=Infinity;
    for(let i=0;i<pathPts.length-1;i++) best = Math.min(best, distToSeg(x,y,pathPts[i],pathPts[i+1]));
    return best;
  }

      if(d.kind==='votes'){avdVoteState={};Object.entries(d.items||{}).forEach(([uid,v])=>{if(v.phase===avdCurrentPhase)avdVoteState[uid]=v.value});if(avdIsHost()&&Object.keys(avdVoteState).length>=(avdRoomState?.playerCount||1)&&!avdResolveInFlight){avdResolveInFlight=true;resolveAvdVote().catch(e=>showEggToast(e.message)).finally(()=>{avdResolveInFlight=false})}}

  function renderMeta(){
    state = STATE.META;
    showOverlay();
    let towerCards = '';
    Object.keys(TOWER_UNLOCK_COST).forEach(key=>{
      const spec = TOWER_TYPES[key];
      const owned = meta.unlocks[key];
      const cost = TOWER_UNLOCK_COST[key];
      towerCards += `<div class="metaCard">
        <div class="mTitle">${spec.symbol} ${spec.name}</div>
        <div class="mDesc">Kalıcı olarak açılır, tüm oyunlarında kullanılabilir.</div>
        <div class="mLevel">${owned?'Sahipsin':'Kilitli'}</div>
        <button data-key="${key}" data-kind="tower" ${owned||meta.dust<cost?'disabled':''}>${owned?'AÇIK':'Satın Al ✦'+cost}</button>
      </div>`;
    });
    towerCards += `<div class="metaCard"><div class="mTitle">🛡️ Tank Islahı</div><div class="mDesc">Çağırma Kulesi'ni maç içinde 1. seviyeden 2. seviyeye toplam 10 kez yükselt. İlerleme yalnızca kazanılan maçlarda kaydedilir. Ay Parçası Kulesi açık olmalı ve 300 Ay Tozu gerekir. Şu an: ${meta.stats.tankIslahiProgress||0}/10</div><div class="mLevel">${isTankIslahiUnlocked()?'AÇIK':((meta.stats.tankIslahiProgress||0)>=10&&meta.unlocks.moonshard&&meta.dust>=300?'Açılmaya hazır':'Kilitli')}</div></div>`;
    let petCards = '';
    Object.keys(PET_TYPES).forEach(key=>{
      const pspec = PET_TYPES[key];
      const owned = meta.unlocks.pets[key];
      petCards += `<div class="metaCard">
        <div class="mTitle">${pspec.symbol} ${pspec.name}</div>
        <div class="mDesc">Haritada dolaşır, düşmanlara saldırır ve yakındaki kulelere hasar artışı sağlar. Sahip olduğun tüm dostlar aynı anda haritada olur.</div>
        <div class="mLevel">${owned?'Sahipsin':'Kilitli'}</div>
        <button data-key="${key}" data-kind="pet" ${owned||meta.dust<PET_COST?'disabled':''}>${owned?'AÇIK':'Satın Al ✦'+PET_COST}</button>
      </div>`;
    });
    let statCards = '';
    Object.keys(META_UPGRADES).forEach(key=>{
      const info = META_UPGRADES[key];
      const lvl = meta.up[key];
      const maxed = lvl>=info.max;
      const cost = metaCost(key);
      statCards += `<div class="metaCard">
        <div class="mTitle">${info.name}</div>
        <div class="mDesc">${info.desc}</div>
        <div class="mLevel">Seviye ${lvl}/${info.max}</div>
        <button data-key="${key}" data-kind="stat" ${maxed||meta.dust<cost?'disabled':''}>${maxed?'MAKS':'Yükselt ✦'+cost}</button>
      </div>`;
    });
    overlay.innerHTML = `
      <button class="cornerCloseBtn" id="closeMetaX">✕</button>
      <h1>AY TOZU MARKETİ</h1>
      <p>Ay Tozu ile kalıcı kuleler, evcil dostlar ve genel güçler kazan. Bunlar her yeni oyunda seninle kalır.</p>
      <h3>Yeni Kuleler</h3>
      <div class="metaGrid">${towerCards}</div>
      <h3>Evcil Dostlar (hepsi aynı anda kullanılabilir)</h3>
      <div class="metaGrid">${petCards}</div>
      <h3>Genel Yükseltmeler</h3>
      <div class="metaGrid">${statCards}</div>
      <div class="statLine" style="margin:8px 0;">Mevcut Ay Tozu: <b>${meta.dust}</b></div>
    `;
    overlay.querySelectorAll('.metaCard button').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const key = btn.dataset.key, kind = btn.dataset.kind;
        if(kind==='stat'){
          const cost = metaCost(key);
          if(meta.dust>=cost && meta.up[key]<META_UPGRADES[key].max){ meta.dust-=cost; meta.up[key]++; saveMeta(); renderMeta(); }
        } else if(kind==='tower'){
          const cost = TOWER_UNLOCK_COST[key];
          if(meta.dust>=cost && !meta.unlocks[key]){ meta.dust-=cost; meta.unlocks[key]=true; saveMeta(); checkAchievements(); renderMeta(); }
        } else if(kind==='pet'){
          if(meta.dust>=PET_COST && !meta.unlocks.pets[key]){ meta.dust-=PET_COST; meta.unlocks.pets[key]=true; saveMeta(); checkAchievements(); renderMeta(); }
        }
      });
    });
    document.getElementById('closeMetaX').addEventListener('click', renderHome);
  }

  function renderGameOver(won){
    if(avdRoomState && avdRoomState.id){
      state=STATE.OVER;showOverlay();avdCurrentPhase='continueVote';
      if(avdIsHost())avdRequest('roomPatch',{roomId:avdRoomState.id,patch:{phase:'continueVote',votes:{},lastResult:won?'won':'lost'}}).catch(e=>showEggToast(e.message));
      avdRoomOverlayActive=true;renderAvdPlayLobby();return;
    }
    state = STATE.OVER;
    showOverlay();
    const riskBonus = infiniteMode ? Math.max(0,(100-endlessCustomLives))*0.5 : 0;
    const dustEarned = Math.round(wave*3 + sessionKills*0.2 + (won?40:0) + riskBonus);
    meta.dust += dustEarned;
    meta.stats.totalDust = (meta.stats.totalDust||0) + dustEarned;
    meta.stats.games++;
    meta.stats.bestWave = Math.max(meta.stats.bestWave, wave);
    if(infiniteMode) meta.stats.bestEndlessWave = Math.max(meta.stats.bestEndlessWave||0, wave);
    meta.stats.kills += sessionKills;
    if(won){
      meta.stats.tankIslahiProgress = (meta.stats.tankIslahiProgress||0) + (summonUpgradeCountThisRun||0);
      meta.stats.wins = (meta.stats.wins||0)+1;
      if(difficulty==='hardcore') meta.stats.hardcoreWin = true;
      if(!meta.stats.winsByDiff) meta.stats.winsByDiff = {};
      meta.stats.winsByDiff[difficulty] = true;
      if(!tookDamageThisRun) meta.stats.flawlessWin = true;
    }
    if(won && !meta.unlocks.tankislahi && meta.stats.tankIslahiProgress>=10 && meta.unlocks.moonshard && meta.dust>=300){ meta.dust-=300; meta.unlocks.tankislahi=true; }
    saveMeta(); updateCardLocks();
    clearRun();
    checkAchievements();
    overlay.innerHTML = `
      <h1>${won ? 'ONUR MADALYASI' : 'VADİ DÜŞTÜ'}</h1>
      <div class="big">Dalga ${wave}</div>
      <div class="sub">${won ? 'tüm dalgaları başarıyla tamamladın' : 'gölgeler kapıdan içeri sızdı'} · yenilen düşman: ${sessionKills}</div>
      <div class="statLine">Kazanılan Ay Tozu: <b>+${dustEarned}</b> ✦</div>
      <div class="menuRow" style="margin-top:12px;">
        <button class="btn" id="retryBtn">TEKRAR DENE</button>
        <button class="btn secondary" id="homeBtn">ANA MENÜ</button>
      </div>
    `;
    document.getElementById('retryBtn').addEventListener('click', ()=>{ hideOverlay(); state=STATE.PLAY; resetGame(); });
    document.getElementById('homeBtn').addEventListener('click', renderHome);
  }

  function buildWave(n){
    const d = DIFF[difficulty];
    const list = [];
    // Miniboss sıklığı artık sabit 5 değil, zorluğun toplam dalga sayısına göre ölçekleniyor
    const totalWavesRef = infiniteMode ? 60 : d.waves;
    const bossInterval = Math.min(10, Math.max(4, Math.round(totalWavesRef/6)));
    if(n % bossInterval === 0) list.push(MAPS[selectedMap].boss);
    // Her zorluğun son dalgasında nihai The Grand Boss çıkar
    if(!infiniteMode && n === d.waves) list.push('grand_boss');
    const count = Math.floor((5+n*1.5)*d.spawnMul);
    const eligible = [];
    ENEMY_POOL.forEach(e=>{ if(e.minWave<=n){ for(let w=0; w<e.weight; w++) eligible.push(e.type); } });
    const exclusive = MAP_EXCLUSIVE_ENEMIES[selectedMap];
    if(exclusive && n>=2){ for(let w=0;w<3;w++) eligible.push(exclusive); }
    for(let i=0;i<count;i++) list.push(eligible[Math.floor(Math.random()*eligible.length)]);
    return list;
  }

  function startWave(){
    if(waveActive || state!==STATE.PLAY) return;
    wave++;
    if(wave > maxWave) endlessMode = true;
    const list = buildWave(wave);
    spawnQueue = list.map((t,i)=>({type:t, delay:i*0.5}));
    spawnTimer = 0; waveActive = true;
    document.getElementById('nextWaveBtn').disabled = true;
    updateHUD();
  }

  function spawnEnemy(type, overrideProgress){
    const d = DIFF[difficulty];
    const base = ENEMY_TYPES[type];
    const waveScale = wave>12 ? (1+(wave-12)*0.08) : 1;
    const hp = Math.round((base.baseHp + wave*base.baseHp*0.15) * d.hpMul * waveScale);
    enemies.push({
      type, hp, maxHp:hp, progress: overrideProgress||0,
      speed: base.speed*(0.94+Math.random()*0.12),
      slowUntil:0, slowFactor:1, burnUntil:0, burnDps:0,
      poisonUntil:0, poisonDps:0, armorBrokenUntil:0,
      r: base.r, spawnTimer: base.spawner?3.2:0, shieldClock:0, shielded:false, revived:false
    });
  }

  function closestProgressOnPath(px,py){
    let best=Infinity, bestProg=0, acc=0;
    for(let i=0;i<pathPts.length-1;i++){
      const a=pathPts[i], b=pathPts[i+1];
      const dx=b.x-a.x, dy=b.y-a.y, len2=dx*dx+dy*dy;
      let t = len2>0 ? ((px-a.x)*dx+(py-a.y)*dy)/len2 : 0;
      t = Math.max(0,Math.min(1,t));
      const cx=a.x+dx*t, cy=a.y+dy*t;
      const dd = Math.hypot(px-cx,py-cy);
      if(dd<best){ best=dd; bestProg = acc + segLen[i]*t; }
      acc += segLen[i];
    }
    return bestProg;
  }

      gold -= cost; goldSpentThisRun += cost;
      towers.push({type,x:pos.x,y:pos.y,level:1,cooldown:0,spent:cost,pathProgress:prog,hp:spec.maxHp,maxHp:spec.maxHp,beamTimer:spec.beamInterval});

  function towerCurrentStats(tw){
    const base = TOWER_TYPES[tw.type];
    const lvlMul = tw.level===1?1: tw.level===2?1.5:2.2;
    const rangeMul = tw.level===1?1: tw.level===2?1.12:1.26;
    let auraDmgMul=1, auraRateMul=1;
    for(const other of towers){
      if(other===tw) continue;
      const ospec = TOWER_TYPES[other.type];
      if(ospec.kind!=='destek') continue;
      const d = Math.hypot(other.x-tw.x, other.y-tw.y);
      if(d>ospec.auraRange) continue;
      if(ospec.auraDmgBonus && !(other.type==='arcane'&&tw.type==='arcane')) auraDmgMul *= (1+ospec.auraDmgBonus);
      if(ospec.auraRateBonus) auraRateMul *= (1-ospec.auraRateBonus);
    }
    for(const pt of pets){ if(Math.hypot(pt.x-tw.x, pt.y-tw.y) <= 110) auraDmgMul *= 1.18; }
    for(const water of waterSpots){ if(water.until>performance.now()/1000 && Math.hypot(water.x-tw.x,water.y-tw.y)<water.size*13+20) auraDmgMul *= water.source==='golTanrilari'?1.35:1+(0.15+(water.size-1)*0.025); }
    return {
      dmg: base.dmg*lvlMul*modifiers.dmgMul*auraDmgMul*(1+meta.up.dmg*0.04),
      range: base.range*rangeMul*modifiers.rangeMul,
      rate: base.rate*modifiers.rateMul*auraRateMul/(performance.now()/1000<(tw.ultimateUntil||0)?(tw.ultimateRate||1):1),
      splash: base.splash,
      slow: base.slow ? base.slow+modifiers.slowBonus : 0,
      slowDur: base.slowDur,
      burnDps: base.burnDps ? base.burnDps*modifiers.dotMul : 0,
      burnDur: base.burnDur,
      poisonDps: base.poisonDps ? base.poisonDps*modifiers.dotMul : 0,
      poisonDur: base.poisonDur,
      armorBreak: base.armorBreak,
      chain: base.chain, chainRange: base.chainRange,
      armorPierce: base.armorPierce,
      freezeDur: base.freezeDur,
      income: base.baseIncome ? base.baseIncome*lvlMul : 0
    };
  }

  function updateFitZoom(){
    const vw=Math.max(1,W-16),vh=Math.max(1,H-TOP_H-16);

  function clampCamera(){
    const left=playArea.x*mapZoom,right=(playArea.x+playArea.w)*mapZoom;
    const top=playArea.y*mapZoom,bottom=(playArea.y+playArea.h)*mapZoom;
    const viewL=0,viewR=W,viewT=TOP_H,viewB=H;
    if(right-left<=viewR-viewL)cameraX=(viewL+viewR-right-left)/2-left;
    else cameraX=Math.max(viewR-right,Math.min(viewL-left,cameraX));
    if(bottom-top<=viewB-viewT)cameraY=(viewT+viewB-bottom-top)/2-top;
    else cameraY=Math.max(viewB-bottom,Math.min(viewT-top,cameraY));
  }
  function centerMapViewport(){

    // Haritayı tamamen en küçük ölçekte göstermek yerine orta yakınlıkta başlat.
    if(!Number.isFinite(mapZoom)||mapZoom<=fitZoom) mapZoom=Math.min(1.06,fitZoom*1.06);
    const worldCenterX=playArea.x+playArea.w*.5, worldCenterY=playArea.y+playArea.h*.5;
    cameraX=W*.5-worldCenterX*mapZoom;

  function nearestTarget(tw, range, hitsFlying){
    let best=null, bestProg=-1;
    for(const e of enemies){
      if(e.flyingFlag && !hitsFlying) continue;
      const pos = posAtProgress(e.progress);
      const d = Math.hypot(pos.x-tw.x, pos.y-tw.y);
      if(d<=range && e.progress>bestProg){ best=e; bestProg=e.progress; }
    }
    return best;
  }
  function spawnParticles(x,y,color,n){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, sp=60+Math.random()*90;
      particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.4+Math.random()*0.3,maxLife:0.5,color});
    }
  }
  function spawnFloater(x,y,text,color){ floaters.push({x,y,text,color,life:0.9,vy:-40}); }

  function applyDamage(e, dmg, physical, piercesArmor){
    const eSpec = ENEMY_TYPES[e.type];
    if(e.shielded) return;
    if(eSpec.evade && Math.random()<eSpec.evade) return;
    let d = dmg;
    const now = performance.now()/1000;
    if(eSpec.armor && physical && !piercesArmor && now>e.armorBrokenUntil) d *= (1-eSpec.armor);
    if(Math.random()<modifiers.critChance) d *= 2;
    e.hp -= d;
  }

  function updatePet(dt){
    for(const pet of pets){
      pet.retargetCd -= dt;
      if(!pet.target || pet.retargetCd<=0 || Math.hypot(pet.target.x-pet.x, pet.target.y-pet.y)<10){
        pet.target = { x: playArea.x+20+Math.random()*Math.max(1,playArea.w-40), y: playArea.y+20+Math.random()*Math.max(1,playArea.h-40) };
        pet.retargetCd = 3+Math.random()*3;
      }
      const dx=pet.target.x-pet.x, dy=pet.target.y-pet.y, d=Math.hypot(dx,dy);
      if(d>2){ pet.x += (dx/d)*70*dt; pet.y += (dy/d)*70*dt; }
      pet.attackCd -= dt;
      if(pet.attackCd<=0){
        let target=null, bestD=160;
        for(const e of enemies){
          const pos=posAtProgress(e.progress);
          const dd=Math.hypot(pos.x-pet.x,pos.y-pet.y);
          if(dd<bestD){ target=e; bestD=dd; }
        }
        if(target){
          applyDamage(target, 55, false);
          const pos = posAtProgress(target.progress);
          spawnParticles(pos.x,pos.y,'#ffd166',12);
          spawnParticles(pet.x,pet.y,'#ffd166',8);
        }
        pet.attackCd = 7+Math.random()*5;
      }
    }
  }

  function update(dt){

      const minX=playArea.x+player.r+8, maxX=playArea.x+playArea.w-player.r-8;

    waterTick+=dt; if(waterTick>=10){waterTick%=10; for(const tw of towers.filter(t=>t.type==='islatici')){const regs=(tw.regions||[]).slice().sort((a,b)=>b.size-a.size||a.order-b.order); if(regs.length){const r=regs[tw.regionCursor++%regs.length]; const used=waterSpots.reduce((a,w)=>a+w.size*(w.onPath?2:1),0); const size=r.size; if(used+size<=90) waterSpots.push({x:r.x,y:r.y,size,until:now+(size===1?20:18*size),onPath:distToPath(r.x,r.y)<44,source:'islatici',occupied:false});}}}

            if(Math.hypot(pos.x-tw.x,pos.y-tw.y)<=stats.range){
              applyDamage(e, stats.dmg, false);
              if(!ENEMY_TYPES[e.type].immuneSlow){ e.slowUntil=now+stats.freezeDur; e.slowFactor=0.05; }
            }
          }
          spawnParticles(tw.x,tw.y,spec.color,20);
          tw.cooldown = stats.rate;
        } else {
          const target = nearestTarget(tw, stats.range, spec.hitsFlying);
          if(target){
            projectiles.push({
              x:tw.x, y:tw.y, target, dmg:stats.dmg, speed:spec.projSpeed, color:spec.color,
              splash:stats.splash, slow:stats.slow, slowDur:stats.slowDur,
              burnDps:stats.burnDps, burnDur:stats.burnDur, poisonDps:stats.poisonDps, poisonDur:stats.poisonDur,
              armorBreak:stats.armorBreak, physical:spec.physical, armorPierce:stats.armorPierce,
              chain:stats.chain, chainRange:stats.chainRange
            });
            tw.cooldown = stats.rate;
          }
        }
      }
    }

    for(let i=projectiles.length-1;i>=0;i--){
      const p = projectiles[i];
      if(!enemies.includes(p.target)){ projectiles.splice(i,1); continue; }
      const tSpec = ENEMY_TYPES[p.target.type];
      const tp = posAtProgress(p.target.progress);
      const dx=tp.x-p.x, dy=tp.y-p.y, d=Math.hypot(dx,dy);
      const step = p.speed*dt;
      if(d<=step || d<8){
        applyDamage(p.target, p.dmg, p.physical, p.armorPierce);
        if(p.slow && !tSpec.immuneSlow){ p.target.slowUntil=now+p.slowDur; p.target.slowFactor=1-p.slow; }
        if(p.burnDps && !tSpec.immuneBurn){ p.target.burnUntil=now+p.burnDur; p.target.burnDps=p.burnDps; }
        if(p.poisonDps && !tSpec.immunePoison){ p.target.poisonUntil=now+p.poisonDur; p.target.poisonDps=p.poisonDps; if(p.armorBreak) p.target.armorBrokenUntil=now+p.poisonDur; }
        if(p.splash>0){
          for(const e2 of enemies){
            if(e2===p.target) continue;
            const pos2 = posAtProgress(e2.progress);
            if(Math.hypot(pos2.x-tp.x,pos2.y-tp.y)<=p.splash) applyDamage(e2, p.dmg*0.55, p.physical, p.armorPierce);
          }
        }
        if(p.chain){
          const hitSet = new Set([p.target]);
          let curTarget=p.target, remaining=p.chain-1, curDmg=p.dmg;
          while(remaining>0){
            curDmg *= 0.75;
            const cp = posAtProgress(curTarget.progress);
            let next=null, bestD=Infinity;
            for(const e3 of enemies){
              if(hitSet.has(e3)) continue;
              const p3 = posAtProgress(e3.progress);
              const dd = Math.hypot(p3.x-cp.x, p3.y-cp.y);
              if(dd<=p.chainRange && dd<bestD){ next=e3; bestD=dd; }
            }
            if(!next) break;
            applyDamage(next, curDmg, false);
            const np = posAtProgress(next.progress);
            spawnParticles(np.x,np.y,p.color,6);
            hitSet.add(next); curTarget=next; remaining--;
          }
        }
        spawnParticles(tp.x,tp.y,p.color,p.splash>0?16:6);
        projectiles.splice(i,1);
      } else { p.x += (dx/d)*step; p.y += (dy/d)*step; }
    }

    // dostlar (çağırma kulesi) - "life" artık bir zamanlayıcı DEĞİL, dayanıklılık puanıdır.
    // Önceden her karede dt kadar azaltılıyordu, bu da birliklerin yolun ortasında
    // süresi dolduğu için birdenbire yok olmasına sebep oluyordu. Artık sadece yolun
    // başına ulaştıklarında (görevlerini tamamladıklarında) kayboluyorlar.
    for(let i=allies.length-1;i>=0;i--){
      const a = allies[i];
      a.progress += (a.hound&&a.reverse?1:-1)*a.speed*dt;
      if(a.hound && (a.progress<totalLen*0.25 || a.progress>totalLen)) a.reverse=!a.reverse;
      a.attackCd -= dt;
      if(a.attackCd<=0){
        const apos = posAtProgress(a.progress);
        let hit=null;
        for(const e of enemies){
          const epos = posAtProgress(e.progress);
          if(Math.hypot(epos.x-apos.x,epos.y-apos.y)<(a.tank?125:40)){ hit=e; break; }
        }
        if(hit){ if(a.tank){projectiles.push({x:apos.x,y:apos.y,target:hit,dmg:a.dmg,speed:520,color:'#b6a58a',splash:0,physical:true});}else{applyDamage(hit,a.dmg,false);} spawnParticles(apos.x,apos.y,a.tank?'#b6a58a':'#5eead4',8); }
        a.attackCd = 0.5;
      }
      if(a.progress<=0 && !a.hound) allies.splice(i,1); if(a.life<=0)allies.splice(i,1);
    }

    // sızıntı gölcükleri
    for(let i=hazards.length-1;i>=0;i--){
      const hz = hazards[i];
      if(now>hz.until){ hazards.splice(i,1); continue; }
      for(const e of enemies){
        const pos = posAtProgress(e.progress);
        if(Math.hypot(pos.x-hz.x,pos.y-hz.y)<=hz.radius) applyDamage(e, hz.dps*dt, false);
      }
    }

    for(let i=particles.length-1;i>=0;i--){
      const pt = particles[i];
      pt.life -= dt; pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.vx*=0.92; pt.vy*=0.92;
      if(pt.life<=0) particles.splice(i,1);
    }
    for(let i=floaters.length-1;i>=0;i--){
      const f = floaters[i]; f.life -= dt; f.y += f.vy*dt;
      if(f.life<=0) floaters.splice(i,1);
    }
    if(invalidFlash){ invalidFlash.t -= dt; if(invalidFlash.t<=0) invalidFlash=null; }

    if(selectedTower && document.getElementById('towerPanel').style.display==='block'){
      const cost = upgradeCost(selectedTower);
      document.getElementById('upgradeBtn').disabled = selectedTower.level>=3 || gold<cost;
    }
  }

    ctx.save(); ctx.globalAlpha=Math.max(0,invalidFlash.t/0.4);
    ctx.beginPath(); ctx.arc(invalidFlash.x,invalidFlash.y,26,0,Math.PI*2);
    ctx.strokeStyle='#ff4d6d'; ctx.lineWidth=3; ctx.stroke();
    ctx.restore();
  }
  function drawPet(){
    if(state!==STATE.PLAY) return;
    for(const pet of pets){
      const pspec = PET_TYPES[pet.kind] || PET_TYPES.spirit;
      ctx.save(); ctx.translate(pet.x,pet.y);
      ctx.beginPath(); ctx.moveTo(-8,-6); ctx.lineTo(-4,-17); ctx.lineTo(0,-6); ctx.closePath();
      ctx.fillStyle=pspec.color; ctx.fill();
      ctx.beginPath(); ctx.moveTo(8,-6); ctx.lineTo(4,-17); ctx.lineTo(0,-6); ctx.closePath();
      ctx.fill();
      ctx.beginPath(); ctx.arc(0,0,11,0,Math.PI*2);
      ctx.fillStyle=pspec.color; ctx.shadowColor=pspec.color; ctx.shadowBlur=14; ctx.fill();
      ctx.shadowBlur=0;
      ctx.font='11px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle='#1a1a2e'; ctx.fillText(pspec.symbol, 0, 1);
      ctx.restore();
    }
  }

  function drawPlayer(){
    ctx.save();
    ctx.beginPath(); ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
    ctx.fillStyle=playerColor; ctx.shadowColor=playerColor; ctx.shadowBlur=16; ctx.fill();
    ctx.shadowBlur=0; ctx.lineWidth=2; ctx.strokeStyle='rgba(225,242,255,.95)'; ctx.stroke();
    ctx.restore();
  }
  function drawInventoryDragPreview(){
    if(!inventoryDragType||!inventoryDragPointer)return;
    const rect=canvas.getBoundingClientRect();
    const sx=inventoryDragPointer.x-rect.left, sy=inventoryDragPointer.y-rect.top;
    const x=(sx-cameraX)/mapZoom,y=(sy-cameraY)/mapZoom;
    const spec=TOWER_TYPES[inventoryDragType];if(!spec)return;
    const range=spec.range||0;
    ctx.save();
    if(range>0){ctx.beginPath();ctx.arc(x,y,range,0,Math.PI*2);ctx.fillStyle='rgba(90,220,220,.09)';ctx.fill();ctx.strokeStyle='rgba(105,240,230,.75)';ctx.lineWidth=2/mapZoom;ctx.setLineDash([7/mapZoom,5/mapZoom]);ctx.stroke();ctx.setLineDash([]);}
    ctx.globalAlpha=.62;ctx.beginPath();ctx.arc(x,y,22,0,Math.PI*2);ctx.fillStyle='#12142e';ctx.fill();ctx.lineWidth=3/mapZoom;ctx.strokeStyle=spec.color;ctx.stroke();
    ctx.globalAlpha=.9;ctx.fillStyle=spec.color;ctx.font='18px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(spec.symbol,x,y+1);
    ctx.restore();
  }


  let avdLocalPosition={x:.5,y:.58},avdLastPositionWrite=0,avdLocalMoveTarget=null;
  const avdHeldKeys=new Set();
  let avdLastAutoVote='';
  const avdLobbyActive=()=>!!(avdRoomState&&state===STATE.PLAY&&['lobby','mapVote','difficultyVote','ready','continueVote'].includes(avdCurrentPhase));
  function avdLobbyScreenArea(){return {x:0,y:TOP_H+4,w:W,h:Math.max(120,H-TOP_H-4)};}
  const avdVotePadRects=()=>{
    const opts=avdVoteOptions();if(!opts.length)return [];
    const area=avdLobbyScreenArea(),cols=Math.min(4,opts.length),rows=Math.ceil(opts.length/cols);
    const gap=14,w=Math.min(190,(area.w-36-(cols-1)*gap)/cols),h=Math.min(84,Math.max(64,area.h*.18));
    const totalW=cols*w+(cols-1)*gap,totalH=rows*h+(rows-1)*gap;
    const sx=(area.w-totalW)/2,sy=area.y+area.h*.57-totalH/2;
    return opts.map((o,i)=>({key:o[0],label:o[1],x:sx+(i%cols)*(w+gap),y:sy+Math.floor(i/cols)*(h+gap),w,h}));
  };
  function drawAvdLobbyWorld(t){
    // Oyunun gerçek biyom arazisi ve çevre çizimi kullanılır; yalnızca yol/kale gizlenir.
    avdLobbyNoRoads=avdCurrentPhase!=='ready';drawBackground(t);avdLobbyNoRoads=false;
    const area=avdLobbyScreenArea();
    const heading=avdCurrentPhase==='lobby'?'OYUNCULAR BEKLENİYOR':
      avdCurrentPhase==='mapVote'?'HARİTA SEÇİMİ · KUTULARA YÜRÜ':
      avdCurrentPhase==='difficultyVote'?'ZORLUK SEÇİMİ · KUTULARA YÜRÜ':avdCurrentPhase==='ready'?'HARİTA HAZIR · OYUNCULARI BEKLEYİN':'DEVAM MI, TAMAM MI?';
    ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='800 15px system-ui';
    ctx.lineWidth=4;ctx.strokeStyle='rgba(5,10,22,.85)';ctx.strokeText(heading,W/2,area.y+25);
    ctx.fillStyle='#fff';ctx.fillText(heading,W/2,area.y+25);
    if((avdCurrentPhase==='lobby'||avdCurrentPhase==='ready')&&avdIsHost()){
      const bx=W/2-95,by=area.y+43;ctx.fillStyle='#f5c85c';ctx.strokeStyle='#fff0b5';ctx.lineWidth=2;
      ctx.beginPath();ctx.roundRect(bx,by,190,42,11);ctx.fill();ctx.stroke();
      ctx.fillStyle='#222';ctx.font='800 14px system-ui';ctx.fillText(avdCurrentPhase==='ready'?'TURU BAŞLAT':'OYLAMAYI BAŞLAT',W/2,by+21);
    }
    avdVotePadRects().forEach(p=>{
      ctx.fillStyle='rgba(15,24,39,.88)';ctx.strokeStyle='#f2e5c5';ctx.lineWidth=2;
      ctx.beginPath();ctx.roundRect(p.x,p.y,p.w,p.h,13);ctx.fill();ctx.stroke();
      ctx.fillStyle='#fff';ctx.font='800 13px system-ui';ctx.fillText(p.label,p.x+p.w/2,p.y+p.h/2-7);
      const n=Object.values(avdVoteState||{}).filter(v=>v===p.key).length;
      ctx.fillStyle='#bfe9ff';ctx.font='11px system-ui';ctx.fillText(n+' / '+(avdRoomState?.players?.length||0)+' oy',p.x+p.w/2,p.y+p.h/2+15);
    });
    ctx.restore();
  }
  function drawAvdLobbyPlayers(){
    const players=avdRoomState?.players||[],area=avdLobbyScreenArea(),positions=window.__avdPositions||{};
    players.forEach((p,i)=>{
      const pos=p.uid===avdMyUid?avdLocalPosition:(positions[p.uid]||{x:.35+(i%5)*.075,y:.68});
      const x=Math.max(20,Math.min(W-20,Number(pos.x)*area.w));
      const y=area.y+Math.max(.18,Math.min(.94,Number(pos.y)))*area.h;
      ctx.save();ctx.shadowColor=p.uid===avdMyUid?'#76e7ff':'#f2c66d';ctx.shadowBlur=13;
      ctx.fillStyle=p.uid===avdMyUid?'#65d9ff':'#f1bd65';ctx.beginPath();ctx.arc(x,y,14,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
      if(p.uid===avdRoomState.ownerUid){ctx.fillStyle='#ffd66b';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText('★',x,y+4)}
      const name=String(p.name||'Oyuncu').slice(0,18);ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.textAlign='center';
      ctx.lineWidth=3;ctx.strokeStyle='rgba(5,10,22,.9)';ctx.strokeText(name,x,y-23);ctx.fillText(name,x,y-23);ctx.restore();
    });
  }
  let avdPositionWritePending=false;
  async function publishAvdPosition(){
    if(!avdRoomState||!avdMyUid||avdPositionWritePending)return;
    const now=Date.now();if(now-avdLastPositionWrite<60)return;avdLastPositionWrite=now;
    avdPositionWritePending=true;
    try{await avdRequest('position',{roomId:avdRoomState.id,x:avdLocalPosition.x,y:avdLocalPosition.y})}
    catch(_){}
    finally{avdPositionWritePending=false;}
  }
  function moveAvdLobbyPlayer(clientX,clientY){
    const rect=canvas.getBoundingClientRect(),area=avdLobbyScreenArea();
    const x=(clientX-rect.left)*(W/rect.width),y=(clientY-rect.top)*(H/rect.height);
    if(x<0||x>W||y<area.y||y>H)return;
    avdLocalMoveTarget={x:x/W,y:(y-area.y)/area.h};
  }
  function updateAvdLobbyMovement(dt){
    if(!avdLobbyActive())return;
    let dx=0,dy=0;
    // Remote oyuncuların Firestore'dan gelen hedeflerine kare kare atlamadan akıcı yaklaş.
    const remoteNow=performance.now(),remotePositions=window.__avdPositions||{},remoteTargets=window.__avdPositionTargets||{};
    for(const [uid,target] of Object.entries(remoteTargets)){
      const current=remotePositions[uid];if(!current)continue;
      // Ağ paketleri arasındaki boşluğu hız tahminiyle doldur: karakter hedefte
      // dur-kalk yapmasın, son ölçülen hızı kısa süre devam ettirsin.
      const age=Math.min(.32,Math.max(0,(remoteNow-target.updatedAt)/1000));
      const predictedX=Math.max(.02,Math.min(.98,target.x+(target.vx||0)*age));
      const predictedY=Math.max(.12,Math.min(.97,target.y+(target.vy||0)*age));
      const blend=1-Math.exp(-22*dt);
      current.x+=(predictedX-current.x)*blend;
      current.y+=(predictedY-current.y)*blend;
    }
    const activeUids=new Set((avdRoomState?.players||[]).map(p=>p.uid));
    for(const uid of Object.keys(remotePositions)){
      if(!activeUids.has(uid)){delete remotePositions[uid];delete remoteTargets[uid];}
    }
    // Lobi karakteri ayrı koordinatlarda çizildiği için normal update() içindeki
    // player.x/player.y joystick hareketi lobi avatarına yansımıyordu.
    // Joystick yönünü doğrudan lobi avatarının hareket vektörüne aktar.
    let moveStrength=1;
    if(joystick.active){
      dx=joystick.dx;dy=joystick.dy;
      const mag=Math.hypot(dx,dy);
      moveStrength=Math.min(1,mag/Math.max(1,joystick.max));
    }else{
      if(avdHeldKeys.has('w')||avdHeldKeys.has('arrowup'))dy--;
      if(avdHeldKeys.has('s')||avdHeldKeys.has('arrowdown'))dy++;
      if(avdHeldKeys.has('a')||avdHeldKeys.has('arrowleft'))dx--;
      if(avdHeldKeys.has('d')||avdHeldKeys.has('arrowright'))dx++;
    }
    if(dx||dy){
      const len=Math.hypot(dx,dy)||1;
      const speed=220*moveStrength; // normal oyun karakteriyle aynı hız
      avdLocalPosition.x=Math.max(.02,Math.min(.98,avdLocalPosition.x+(dx/len)*(speed*dt/Math.max(1,W))));
      avdLocalPosition.y=Math.max(.12,Math.min(.97,avdLocalPosition.y+(dy/len)*(speed*dt/Math.max(1,avdLobbyScreenArea().h))));
      avdLocalMoveTarget=null;
    }else if(avdLocalMoveTarget){
      const tx=avdLocalMoveTarget.x-avdLocalPosition.x,ty=avdLocalMoveTarget.y-avdLocalPosition.y,dist=Math.hypot(tx,ty);
      if(dist<.006){avdLocalPosition={...avdLocalMoveTarget};avdLocalMoveTarget=null;}
      else{
        const area=avdLobbyScreenArea(),dx=tx*W,dy=ty*area.h,pixels=Math.hypot(dx,dy);
        const step=Math.min(pixels,220*dt),ratio=step/Math.max(1,pixels);
        avdLocalPosition.x+=tx*ratio;avdLocalPosition.y+=ty*ratio;
      }
    }
    publishAvdPosition();
    if(!dx&&!dy&&!avdLocalMoveTarget&&['mapVote','difficultyVote','continueVote'].includes(avdCurrentPhase)){
      const area=avdLobbyScreenArea(),x=avdLocalPosition.x*W,y=area.y+avdLocalPosition.y*area.h;
      const pad=avdVotePadRects().find(p=>x>=p.x&&x<=p.x+p.w&&y>=p.y&&y<=p.y+p.h);
      if(pad){const voteKey=avdCurrentPhase+':'+pad.key;if(avdLastAutoVote!==voteKey){avdLastAutoVote=voteKey;castAvdVote(pad.key);}}
    }
  }
  canvas.addEventListener('click',e=>{
    if(!avdLobbyActive())return;
    const rect=canvas.getBoundingClientRect(),sx=(e.clientX-rect.left)*(W/rect.width),sy=(e.clientY-rect.top)*(H/rect.height),area=avdLobbyScreenArea();
    const hostButton=avdCurrentPhase==='lobby'&&avdIsHost()&&sx>=W/2-95&&sx<=W/2+95&&sy>=area.y+43&&sy<=area.y+85;
    if(hostButton){avdRequest('roomPatch',{roomId:avdRoomState.id,patch:{phase:'mapVote',votes:{},round:Number(avdRoomState.round||0)+1}}).catch(e=>showEggToast(e.message));return;}
    moveAvdLobbyPlayer(e.clientX,e.clientY);
  });
  window.addEventListener('keydown',e=>{
    if(!avdLobbyActive())return;
    const k=e.key.toLowerCase();
    if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){avdHeldKeys.add(k);e.preventDefault();}
  });
  window.addEventListener('keyup',e=>avdHeldKeys.delete(e.key.toLowerCase()));
  window.addEventListener('blur',()=>avdHeldKeys.clear());

  function render(t){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,W,H);
    ctx.save();
    const avdWorldLobby=avdLobbyActive();
    if(state===STATE.PLAY&&!avdWorldLobby){ctx.translate(cameraX,cameraY);ctx.scale(mapZoom,mapZoom);}
    // Harita ve bütün oyun nesneleri sabit PC harita çerçevesinin dışına taşmaz.
    if(avdWorldLobby){const area=avdLobbyScreenArea();ctx.beginPath();ctx.rect(0,area.y,W,area.h);ctx.clip();drawAvdLobbyWorld(t);}
    else{ctx.beginPath();ctx.rect(playArea.x,playArea.y,playArea.w,playArea.h);ctx.clip();drawBackground(t);}
    if(state===STATE.PLAY){
      if(avdWorldLobby)drawAvdLobbyPlayers();
      else {
      drawHazards(); drawTowers(); drawEnemies(); drawAllies(); drawProjectiles(); drawParticles(); drawFloaters(); drawPet(); drawInvalidFlash(); drawPlayer(); drawInventoryDragPreview();
      if(selectedTower && document.getElementById('towerPanel').style.display==='block') positionTowerPanel(selectedTower);
      }
    }
    ctx.restore();
  }
  function loop(t){
    const dt = Math.min((t-lastT)/1000, 0.033);
    lastT = t;
    if(state===STATE.PLAY){
      if(avdLobbyActive())updateAvdLobbyMovement(dt);else{avdHeldKeys.clear();avdLocalMoveTarget=null;}
      update(dt);
      if(inventoryToggle && (inventoryToggle.style.display!=='flex' || inventoryToggle.style.visibility!=='visible' || inventoryToggle.style.pointerEvents!=='auto')){
        setInventoryToggleVisible(true);
      }
    }else if(inventoryToggle && inventoryToggle.style.display!=='none'){
      setInventoryToggleVisible(false);
    }
    render(t);
    requestAnimationFrame(loop);
  }

  resize();
  requestAnimationFrame(loop);
  renderHome();

})();


  // ===== Platform: Reborn profil senkronizasyonu =====
  const PLATFORM_REBORN_MESSAGE = 'PLATFORM_REBORN_GAME_STATS';
  let towerSyncTimer = null;
  let lastTowerStatsJSON = '';

  function unlockedAchievementList(){
    const records = meta.achievements || {};
    const defs = (typeof ACHIEVEMENTS !== 'undefined') ? ACHIEVEMENTS : [];
    return Object.keys(records).map(id => {
      const def = defs.find(a => a.id === id) || {};
      const rec = records[id] || {};
      return {id, name:def.name || id, trophy:def.trophy || '🏆', date:Number(rec.date || 0)};
    }).sort((a,b)=>b.date-a.date);
  }

  function buildTowerPlatformStats(){
    const towerUnlocks = Object.keys(meta.unlocks || {}).filter(k => k !== 'pets' && meta.unlocks[k] === true).map(k => ({
      id:k,
      name:(typeof TOWER_TYPES !== 'undefined' && TOWER_TYPES[k] ? TOWER_TYPES[k].name : k),
      symbol:(typeof TOWER_TYPES !== 'undefined' && TOWER_TYPES[k] ? TOWER_TYPES[k].symbol : '✦')
    }));
    const pets = Object.keys((meta.unlocks && meta.unlocks.pets) || {}).filter(k => meta.unlocks.pets[k]).map(k => ({
      id:k,
      name:(typeof PET_TYPES !== 'undefined' && PET_TYPES[k] ? PET_TYPES[k].name : k),
      symbol:(typeof PET_TYPES !== 'undefined' && PET_TYPES[k] ? PET_TYPES[k].symbol : '🐾')
    }));
    const upgrades = Object.keys(meta.up || {}).filter(k => Number(meta.up[k] || 0) > 0).map(k => ({
      id:k,
      name:(typeof META_UPGRADES !== 'undefined' && META_UPGRADES[k] ? META_UPGRADES[k].name : k),
      level:Number(meta.up[k] || 0)
    }));
    return {
      market:{towers:towerUnlocks,pets,upgrades},
      highestEndlessWave:Number((meta.stats && meta.stats.bestEndlessWave) || 0),
      totalEnemiesDefeated:Number((meta.stats && meta.stats.kills) || 0),
      totalGamesPlayed:Number((meta.stats && meta.stats.games) || 0),
      moonDust:Number(meta.dust || 0),
      achievements:unlockedAchievementList(),
      achievementCount:Object.keys(meta.achievements || {}).length,
      updatedAt:Date.now()
    };
  }

  function syncTowerStatsToPlatform(force=false){
    const stats=buildTowerPlatformStats();
    const json=JSON.stringify(stats);
    if(!force && json===lastTowerStatsJSON) return;
    lastTowerStatsJSON=json;
    const message={type:PLATFORM_REBORN_MESSAGE,game:'towerDefense',version:1,stats};
    try{ if(window.parent && window.parent!==window) window.parent.postMessage(message,'*'); }catch(e){}
    try{ if(window.opener && !window.opener.closed) window.opener.postMessage(message,'*'); }catch(e){}
  }
  function scheduleTowerPlatformSync(){ clearTimeout(towerSyncTimer); towerSyncTimer=setTimeout(()=>syncTowerStatsToPlatform(false),300); }
  setInterval(()=>syncTowerStatsToPlatform(false),3000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')syncTowerStatsToPlatform(true)});
  window.addEventListener('pagehide',()=>syncTowerStatsToPlatform(true));
  window.addEventListener('message',e=>{if(e.data&&e.data.type==='PLATFORM_REBORN_REQUEST_STATS')syncTowerStatsToPlatform(true)});
  setTimeout(()=>syncTowerStatsToPlatform(true),700);

</script>
</body>
